name: Test Workflow A
run-name: "Test A | ${{ inputs.correlation_id || 'manual' }} | ${{ inputs.result_mode }}"

on:
  workflow_dispatch:
    inputs:
      wait_seconds:
        description: "Wait time in seconds (integer, 0..600)"
        required: true
        type: number
        default: 15
      failure_rate:
        description: "Failure percentage in random mode (integer, 0..100)"
        required: true
        type: number
        default: 30
      result_mode:
        description: "random / always success / always failure / fail first attempt then pass"
        required: true
        type: choice
        options:
          - random
          - success
          - failure
          - fail_first_attempt
        default: random
      correlation_id:
        description: "Optional test identifier shown in the run title"
        required: false
        type: string
        default: ""

permissions:
  contents: read




jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate input and test fixture
        env:
          WAIT_SECONDS: ${{ inputs.wait_seconds }}
          FAILURE_RATE: ${{ inputs.failure_rate }}
          RESULT_MODE: ${{ inputs.result_mode }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          seconds = int(os.environ['WAIT_SECONDS'])
          rate = int(os.environ['FAILURE_RATE'])
          assert 0 <= seconds <= 600, 'wait_seconds must be 0..600'
          assert 0 <= rate <= 100, 'failure_rate must be 0..100'
          assert os.environ['RESULT_MODE'] in {'random', 'success', 'failure', 'fail_first_attempt'}
          assert Path('.github/scripts/simulate_workflow.py').is_file()
          print('Inputs and fixture validated', flush=True)
          PY

  lint:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check Python syntax
        run: python3 -m py_compile .github/scripts/simulate_workflow.py
      - name: Simulate static checks
        run: sleep 5

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Create simulated build manifest
        run: |
          mkdir -p dist
          printf 'commit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/build.txt
          cat dist/build.txt
          sleep 10

  tests:
    name: Test (${{ matrix.suite }})
    needs: [lint, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, api, regression]
    steps:
      - uses: actions/checkout@v6
      - name: Wait and simulate test result
        env:
          WORKFLOW_A: "A / ${{ matrix.suite }}"
          WAIT_SECONDS: ${{ inputs.wait_seconds }}
          FAILURE_RATE: ${{ inputs.failure_rate }}
          # Only regression fails deterministically on the first attempt.
          # Random mode applies independently to all three suites.
          RESULT_MODE: ${{ inputs.result_mode == 'fail_first_attempt' && matrix.suite != 'regression' && 'success' || inputs.result_mode }}
        run: python3 .github/scripts/simulate_workflow.py

  integration:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Simulate integration verification
        run: |
          echo "All test suites succeeded; checking integration"
          sleep 10

  package:
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Simulate packaging
        run: |
          echo "Integration passed; simulating package creation (no publishing)"
          sleep 5
